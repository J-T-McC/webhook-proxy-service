    <!--
        Standalone copy of the app mark in `resources/js/components/AppLogoIcon.vue`.
        Colours are baked in rather than inherited: a favicon has no page context to
        take `currentColor` or a Tailwind class from. Blue is #3b82f6, Tailwind's
        blue-500, matching the `text-blue-500` the in-app mark uses.

        The cursor line does not pulse here. The in-app mark animates it, but a
        favicon that animates is distracting in a tab strip and support is
        inconsistent across browsers, so this copy is deliberately still.
    -->
