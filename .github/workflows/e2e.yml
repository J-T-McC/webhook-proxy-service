name: e2e

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest

    env:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
      # Inline queue processing: an ingested webhook is captured and settled
      # before the request returns, so a spec can assert on the event queue with
      # no worker to supervise. Cache and session stay on the database, so the
      # job needs no Redis.
      QUEUE_CONNECTION: sync
      CACHE_STORE: database
      SESSION_DRIVER: database
      MAIL_MAILER: log
      E2E_ARTISAN: php artisan
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_START_SERVER: '1'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # Written before `composer setup`, which migrates: the migration set is
      # MySQL-only and .env.example still names SQLite (docs/stack/stack.md).
      - name: Write the end-to-end environment
        run: |
          cp .env.example .env
          {
            echo "APP_URL=${APP_URL}"
            echo "DB_CONNECTION=${DB_CONNECTION}"
            echo "DB_HOST=${DB_HOST}"
            echo "DB_PORT=${DB_PORT}"
            echo "DB_DATABASE=${DB_DATABASE}"
            echo "DB_USERNAME=${DB_USERNAME}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "QUEUE_CONNECTION=${QUEUE_CONNECTION}"
            echo "CACHE_STORE=${CACHE_STORE}"
            echo "SESSION_DRIVER=${SESSION_DRIVER}"
            echo "MAIL_MAILER=${MAIL_MAILER}"
          } >> .env

      # Installs dependencies, generates the app key, migrates, and builds the
      # frontend. The specs run against that build, never against a dev server.
      - name: Setup application
        run: composer setup

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
